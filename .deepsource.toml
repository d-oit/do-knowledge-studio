version = "1"

test_patterns = [
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*"
]

exclude_patterns = [
  "dist/",
  "node_modules/",
  "coverage/",
  ".mimicode/",
  ".agents/",
  "plans/",
  "scripts/",
  "*.config.*"
]

[[analyzers]]
name = "javascript-typescript"
enabled = true

  [analyzers.meta]
  cyclomatic_complexity_threshold = "critical"
  max_functions = "100"
  skip_doc_coverage = ["test", "src"]
  plugins = ["react"]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"
  dialect = "typescript"

  [analyzers.meta.ratings]
    documentation_coverage = "A"

  [analyzers.meta.checks]
  # Disable Qwik-specific rules (project doesn't use Qwik)
  Biome_lint_correctness_useQwikValidLexicalScope = "off"
  # JS-0067: false positive for ES module exports — top-level declarations
  # in ES modules are module-scoped, not global.
  JS_0067 = "off"
  # JS-R1005: complexity threshold handled via cyclomatic_complexity_threshold above
  JS_R1005 = "off"
  # JS-0046: false positive on React components — JSX text nodes are not global refs
  JS_0046 = "off"
  # JS-0302: false positive on Zustand store — inferred types are used, not unused
  JS_0302 = "off"

[[transformers]]
name = "eslint"
enabled = true

  [transformers.meta]
  config_file = "eslint.config.mjs"

[[test_runners]]
name = "vitest"
enabled = true

  [test_runners.meta]
  config_file = "vitest.config.ts"
