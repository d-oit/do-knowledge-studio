version = "1"

test_patterns = [
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*"
]

exclude_patterns = [
  "dist/",
  "node_modules/",
  "coverage/",
  ".mimicode/",
  ".agents/",
  "plans/",
  "scripts/",
  "*.config.*"
]

[[analyzers]]
name = "javascript-typescript"
enabled = true

  [analyzers.meta]
  cyclomatic_complexity_threshold = "critical"
  max_functions = "100"
  plugins = ["react"]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"
  dialect = "typescript"

[[transformers]]
name = "eslint"
enabled = true

  [transformers.meta]
  config_file = "eslint.config.mjs"

[[test_runners]]
name = "vitest"
enabled = true

  [test_runners.meta]
  config_file = "vitest.config.ts"
