version = "1"

test_patterns = [
  "**/__tests__/**",
  "**/*.test.*",
  "**/*.spec.*"
]

exclude_patterns = [
  "dist/",
  "node_modules/",
  "coverage/",
  ".mimicode/",
  ".agents/",
  "plans/",
  "scripts/",
  "*.config.*"
]

[[analyzers]]
name = "javascript-typescript"
enabled = true

  [analyzers.meta]
  cyclomatic_complexity_threshold = "critical"
  max_functions = "100"
  plugins = ["react"]
  environment = ["nodejs", "browser"]
  module_system = "es-modules"
  dialect = "typescript"

  # JS-0067: false positive for ES module exports — top-level declarations in
  # ES modules are module-scoped, not global (DeepSource tool bug, confirmed).
  [[analyzers.meta.issue_patterns]]
  pattern = "JS-0067"
  skip = true

  # JS-R1005: complexity threshold already enforced via cyclomatic_complexity_threshold.
  [[analyzers.meta.issue_patterns]]
  pattern = "JS-R1005"
  skip = true

  # JS-0098: void expression false positive (ES module cleanup pattern).
  [[analyzers.meta.issue_patterns]]
  pattern = "JS-0098"
  skip = true

  # JS-0045: arrow function no-return false positive on React event handlers.
  [[analyzers.meta.issue_patterns]]
  pattern = "JS-0045"
  skip = true

  # JS-W1042: unused variable false positive for inferred types in Zustand stores.
  [[analyzers.meta.issue_patterns]]
  pattern = "JS-W1042"
  skip = true

[[transformers]]
name = "eslint"
enabled = true

  [transformers.meta]
  config_file = "eslint.config.mjs"

[[test_runners]]
name = "vitest"
enabled = true

  [test_runners.meta]
  config_file = "vitest.config.ts"
