---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v3+ requires a paid GITLEAKS_LICENSE secret (see plans/115-gitleaks-license-pre-existing-2026-08-11.md).
      - dependency-name: "gitleaks/gitleaks-action"
        versions: ["3.x"]
