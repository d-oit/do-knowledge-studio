---
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'NOTICE'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly E2E backfill on main so the suite never goes stale between
    # frontend PRs (see plans/122). Only the e2e-tests job runs on schedule.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manual lever to exercise the E2E-on-main path on demand (plans/122 W2).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.default.outputs.frontend }}
      tooling: ${{ steps.filter.outputs.tooling || steps.default.outputs.tooling }}
      any_code: ${{ steps.filter.outputs.any_code || steps.default.outputs.any_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Path Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        continue-on-error: true
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'package.json'
            tooling:
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'tsconfig.json'
            any_code:
              - '!(**.md|docs/**)'
      - name: Default outputs on diff API failure
        id: default
        if: always()
        run: |
          frontend="${{ steps.filter.outputs.frontend || 'true' }}"
          tooling="${{ steps.filter.outputs.tooling || 'true' }}"
          any_code="${{ steps.filter.outputs.any_code || 'true' }}"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "any_code=$any_code" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bats
        # ubuntu-latest images do not ship bats-core; the BATS suite is a
        # mandatory part of the quality gate.
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run quality gate
        run: ./scripts/quality_gate.sh --changed
        env:
          SKIP_GLOBAL_HOOKS_CHECK: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # quality-gate runs tests on changed files only (via quality_gate.sh --changed);
      # this job runs the full test suite to catch regressions outside the change set.
      - name: Run Vitest
        run: pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, unit-tests]
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm run test:e2e --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, unit-tests]
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm run build

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, unit-tests]
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm test:coverage
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Lines coverage: ${COVERAGE}%"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
