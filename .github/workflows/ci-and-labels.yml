---
name: CI (2026 Edition)

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      tooling: ${{ steps.filter.outputs.tooling }}
      any_code: ${{ steps.filter.outputs.any_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Path Filter
        uses: dorny/paths-filter@0bc4621a3135347011ad047f9ecf449bf72ce2bd  # v3.0.0
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'vite.config.ts'
              - 'package.json'
            tooling:
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'tsconfig.json'
            any_code:
              - '!(**.md|docs/**)'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: ./scripts/quality_gate.sh --changed
        env:
          SKIP_GLOBAL_HOOKS_CHECK: true

  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: [changes, quality-gate]
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E Tests
        run: npm run test:e2e:ci
