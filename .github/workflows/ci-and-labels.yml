---
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'NOTICE'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || steps.default.outputs.frontend }}
      tooling: ${{ steps.filter.outputs.tooling || steps.default.outputs.tooling }}
      any_code: ${{ steps.filter.outputs.any_code || steps.default.outputs.any_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Path Filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        continue-on-error: true
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'vite.config.ts'
              - 'package.json'
            tooling:
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'tsconfig.json'
            any_code:
              - '!(**.md|docs/**)'
      - name: Default outputs on diff API failure
        id: default
        if: always()
        run: |
          frontend="${{ steps.filter.outputs.frontend || 'true' }}"
          tooling="${{ steps.filter.outputs.tooling || 'true' }}"
          any_code="${{ steps.filter.outputs.any_code || 'true' }}"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "any_code=$any_code" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gate
        run: ./scripts/quality_gate.sh --changed
        env:
          SKIP_GLOBAL_HOOKS_CHECK: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, quality-gate]
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, unit-tests]
    if: needs.changes.outputs.any_code == 'true'
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E Tests
        run: pnpm run test:e2e:ci
