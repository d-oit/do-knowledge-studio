---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'NOTICE'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly E2E backfill on main so the suite never goes stale between
    # frontend PRs (see plans/122). Only `unit-tests` and `e2e-tests` run on
    # schedule — and `unit-tests` must keep running there, because `e2e-tests`
    # needs it: a job whose dependency was skipped is skipped too, which is how
    # this nightly silently did nothing for weeks (plans/149).
    - cron: '0 3 * * *'
  # Manual lever to exercise the E2E-on-main path on demand (plans/122 W2).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.forced.outputs.frontend || steps.filter.outputs.frontend || steps.default.outputs.frontend }}
      tooling: ${{ steps.forced.outputs.tooling || steps.filter.outputs.tooling || steps.default.outputs.tooling }}
      any_code: ${{ steps.forced.outputs.any_code || steps.filter.outputs.any_code || steps.default.outputs.any_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Path Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        continue-on-error: true
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'package.json'
            tooling:
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'tsconfig.json'
            any_code:
              - '!(**.md|docs/**)'
      - name: Treat every path as changed on scheduled and manual runs
        id: forced
        # A nightly or a manual dispatch is a full sweep by definition: there is no
        # diff to filter, and the filter's fallback (list every file as added) is
        # incidental, not guaranteed. If it ever resolves to `false`, `unit-tests`
        # is skipped, and `e2e-tests` — which needs it — is skipped with it, which
        # is exactly the silent no-op that hid the nightly for weeks (plans/149).
        # Pull requests and pushes keep the real diff so their scope is unchanged.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "frontend=true"
            echo "tooling=true"
            echo "any_code=true"
          } >> "$GITHUB_OUTPUT"
      - name: Default outputs on diff API failure
        id: default
        if: always()
        run: |
          frontend="${{ steps.filter.outputs.frontend || 'true' }}"
          tooling="${{ steps.filter.outputs.tooling || 'true' }}"
          any_code="${{ steps.filter.outputs.any_code || 'true' }}"
          {
            echo "frontend=$frontend"
            echo "tooling=$tooling"
            echo "any_code=$any_code"
          } >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The gate diffs `--changed` against the merge base of the base branch,
          # and against HEAD~1 when the checked-out tip *is* that branch (a push
          # to main). Depth 2 keeps the parent commit available so a main push is
          # scoped to what landed instead of widening to the full gate.
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install bats
        # ubuntu-latest images do not ship bats-core; the BATS suite is a
        # mandatory part of the quality gate.
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run quality gate
        run: ./scripts/quality_gate.sh --changed

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # Runs on schedule as well as on PRs: `e2e-tests` needs this job, and GitHub
    # skips a job whose dependency was skipped — excluding schedule here is what
    # made the nightly sweep a no-op (plans/149).
    if: needs.changes.outputs.any_code == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # quality-gate runs tests on changed files only (via quality_gate.sh --changed);
      # this job runs the full test suite to catch regressions outside the change set.
      - name: Run Vitest
        run: pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # PR runs finish in ~3 minutes; the nightly sweep runs every project,
    # including the two WebKit ones, so the ceiling covers both shapes.
    timeout-minutes: 40
    needs: [changes, unit-tests]
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        # Only the nightly sweep and a manual dispatch install WebKit: the
        # `mobile` (iPhone 13, 390px) and `tablet` (iPad Pro 11, 834px) projects
        # are WebKit device descriptors, and viewport-specific layout regressions
        # are invisible to a Chromium-only run — that is how the graph
        # label-click defect reached main (plans/148 §6.2, plans/149).
        #
        # Pull requests *and* pushes to main stay on Chromium: a push to main is
        # a merge that the PR already validated, and the four-project sweep costs
        # ~10 minutes there. The sweep belongs to the nightly, which exists for
        # exactly that gap.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm exec playwright install --with-deps chromium webkit
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Run E2E tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm run test:e2e
          else
            pnpm run test:e2e --project=chromium
          fi
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-artifacts
          # Both directories matter. The HTML report is written by the `html`
          # reporter (CI only), and `test-results/` holds the traces and error
          # contexts (`trace: 'on-first-retry'`). Uploading `playwright-report/`
          # alone kept nothing at all, because the list reporter never creates it —
          # so a failed run left no evidence to diagnose (plans/153).
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, unit-tests]
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm run build

  deps-verify:
    name: Dependency Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # AGENTS.md mandates verify-deps.sh after any dependency change; this job
    # enforces it automatically whenever manifests or the lockfile move.
    if: >-
      needs.changes.outputs.any_code == 'true' &&
      github.event_name != 'schedule' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect dependency manifest changes
        id: depdiff
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(package\.json|pnpm-lock\.yaml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pnpm
        if: steps.depdiff.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        if: steps.depdiff.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.depdiff.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run verify-deps
        if: steps.depdiff.outputs.changed == 'true'
        run: ./scripts/verify-deps.sh

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, unit-tests]
    if: needs.changes.outputs.any_code == 'true' && github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm test:coverage
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Lines coverage: ${COVERAGE}%"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
