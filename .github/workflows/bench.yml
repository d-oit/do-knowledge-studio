---
name: Benchmarks

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.bench.config.ts'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Performance Benchmarks (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run benchmark guards
        # The `*.bench.test.ts` files hold exported `it()` perf guards with hard
        # thresholds; they fail the job on a real regression, and their
        # durations feed the baseline comparison below.
        run: |
          set -o pipefail
          pnpm exec vitest run --config vitest.bench.config.ts \
            --reporter=json --outputFile=bench-report.json 2>&1 | tee bench-results.txt
      - name: Compare durations with the recorded baseline
        # Advisory: order-of-magnitude regressions are warnings, not a red build.
        # Shared runners cannot support a tighter bound (plans/191).
        run: node scripts/check-bench-baseline.mjs bench-report.json
      - name: Run benchmark measurements
        # `bench()` blocks live in `*.bench.ts` and only execute under bench mode.
        # Timings are recorded as an artifact, not compared: shared runners vary
        # too much for a percentage gate (plans/perf-baselines.md).
        run: |
          set -o pipefail
          pnpm exec vitest bench --run --config vitest.bench.config.ts \
            2>&1 | tee bench-measurements.txt
      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-results
          path: |
            bench-results.txt
            bench-report.json
            bench-measurements.txt
          if-no-files-found: warn
          retention-days: 14
