---
name: Property and Mutation Tests

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:

concurrency:
  group: property-mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  property-tests:
    name: Expanded Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run expanded property profile
        run: pnpm run test:properties:nightly
  mutation-shards:
    name: Mutation shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: sync-merge
            file: src/lib/sync/merge.ts
          - name: sync-causality
            file: src/lib/sync/causality.ts
          - name: sync-tombstones
            file: src/lib/sync/tombstones.ts
          - name: sync-conflict
            file: src/lib/sync/conflict.ts
          - name: sync-bridge
            file: src/lib/sync/bridge.ts
          - name: sync-merge-reconciliation
            file: src/lib/sync/merge-reconciliation.ts
          - name: studio-migrations
            file: src/lib/studio/migrations.ts
          - name: studio-hydration
            file: src/lib/studio/hydration.ts
          - name: studio-hydration-guard
            file: src/lib/studio/hydration-guard.ts
          - name: studio-hydration-quarantine
            file: src/lib/studio/hydration-quarantine.ts
          - name: studio-cross-tab
            file: src/lib/studio/cross-tab.ts
          - name: studio-cross-tab-merge
            file: src/lib/studio/cross-tab-merge.ts
          - name: studio-cross-tab-tombstones
            file: src/lib/studio/cross-tab-tombstones.ts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mutation shard
        run: |
          set -o pipefail
          pnpm exec stryker run --mutate "${{ matrix.file }}" 2>&1 | tee mutation-results.txt
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mutation-${{ matrix.name }}
          path: |
            reports/mutation.html
            reports/mutation.json
            mutation-results.txt
          if-no-files-found: error
          retention-days: 14
  mutation-score:
    name: Aggregate mutation score
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Download mutation reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mutation-*
          path: mutation-artifacts
      - name: Enforce aggregate mutation score
        if: always()
        env:
          MUTATION_SHARDS_RESULT: ${{ needs.mutation-shards.result }}
        run: |
          if [[ "$MUTATION_SHARDS_RESULT" != "success" ]]; then
            echo "Mutation shard matrix completed with status: $MUTATION_SHARDS_RESULT" >&2
            exit 1
          fi
          jq -s . mutation-artifacts/mutation-*/reports/mutation.json | node scripts/check-mutation-score.mjs
      - name: Upload aggregate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: property-mutation-results
          path: mutation-artifacts
          if-no-files-found: error
          retention-days: 14
