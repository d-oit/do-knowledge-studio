---
name: Dependabot Alert Check

# yamllint disable-line rule:truthy
on:
  schedule:
    # Run nightly at 04:17 UTC — after the 03:00 CI nightly so the two
    # scheduled workloads never contend for runners.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Open Alert Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Fails when any open Dependabot alert exists so dependency
      # regressions surface the next morning instead of during the next
      # PR sweep (plans/127). Informational alerts (auto-dismissed) are
      # not counted.
      #
      # GITHUB_TOKEN cannot read Dependabot alerts: the REST endpoint
      # 403s ("Resource not accessible by integration") and GraphQL
      # vulnerabilityAlerts silently returns an empty connection
      # (verified 2026-08-16, plans/127). The check therefore uses the
      # gh CLI with DEPENDABOT_TOKEN — a fine-grained PAT with the
      # "Dependabot alerts: Read" repository permission. When the secret
      # is absent the job fails loudly instead of reporting zero alerts.
      - name: List open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::DEPENDABOT_TOKEN secret missing (PAT with Dependabot alerts: Read)"
            exit 1
          fi
          alerts="$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100")"
          count="$(printf '%s' "$alerts" | jq 'length')"
          echo "open_alerts=$count" >>"$GITHUB_OUTPUT"
          echo "Open Dependabot alerts: $count"
          if [[ "$count" -gt 0 ]]; then
            fmt='"\(.number) \(.security_advisory.severity) \(.dependency.package.name)"'
            printf '%s\n' "$alerts" | jq -r ".[] | $fmt"
          fi

      - name: Fail on open alerts
        if: steps.alerts.outputs.open_alerts != '0'
        run: |
          echo "::error::Open Dependabot alerts detected: ${{ steps.alerts.outputs.open_alerts }}"
          exit 1
