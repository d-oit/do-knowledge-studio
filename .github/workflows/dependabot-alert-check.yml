---
name: Dependabot Alert Check

# yamllint disable-line rule:truthy
on:
  schedule:
    # Run nightly at 04:17 UTC — after the 03:00 CI nightly so the two
    # scheduled workloads never contend for runners.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  check:
    name: Open Alert Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Fails when any open Dependabot alert exists so dependency
      # regressions surface the next morning instead of during the next
      # PR sweep (plans/127). Informational alerts (auto-dismissed) are
      # not counted.
      #
      # The REST endpoint requires a token with the "Dependabot alerts"
      # permission, which GITHUB_TOKEN does NOT have (403 "Resource not
      # accessible by integration", verified 2026-08-16). GraphQL
      # vulnerabilityAlerts is the fallback that works with the Actions
      # token; a null result means no access and must fail loudly rather
      # than look like zero alerts.
      - name: List open Dependabot alerts
        id: alerts
        run: |
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY##*/}"
          query='query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              vulnerabilityAlerts(first: 100) {
                totalCount
                nodes { securityAdvisory { ghsaId summary severity } }
              }
            }
          }'
          result="$(gh api graphql -F owner="$repo_owner" -F name="$repo_name" -f query="$query" --jq '.data.repository.vulnerabilityAlerts')"
          count="$(printf '%s' "$result" | jq -r '.totalCount // empty')"
          if [[ -z "$count" ]]; then
            echo "::error::Cannot read Dependabot alerts (GITHUB_TOKEN lacks Dependabot alerts permission)"
            exit 1
          fi
          echo "open_alerts=$count" >>"$GITHUB_OUTPUT"
          echo "Open Dependabot alerts: $count"
          if [[ "$count" -gt 0 ]]; then
            printf '%s\n' "$result" | jq -r '.nodes[] | "\(.securityAdvisory.ghsaId) \(.securityAdvisory.severity): \(.securityAdvisory.summary)"'
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on open alerts
        if: steps.alerts.outputs.open_alerts != '0'
        run: |
          echo "::error::Open Dependabot alerts detected: ${{ steps.alerts.outputs.open_alerts }}"
          exit 1
