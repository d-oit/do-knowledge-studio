---
name: PR Merge-State Diagnoser

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose Blocked Merge State
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Posts one idempotent comment (marker-delimited) naming the real
      # blocker on BLOCKED pull requests: in-flight runs, failed runs,
      # unresolved review threads (outdated ones count too, LESSON-032),
      # or all-green staleness. The logic lives in
      # scripts/diagnose-merge-state.sh. Informational only — never a merge
      # gate — so fork PRs and transient API errors must not turn the
      # check red.
      - name: Diagnose and comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: ./scripts/diagnose-merge-state.sh
