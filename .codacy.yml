---
exclude_paths:
  - "dist/**"
  - "node_modules/**"
  - "coverage/**"
  - ".mimicode/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
engines:
  biome:
    enabled: true
    config:
      rules:
        lint/correctness/useQwikValidLexicalScope: "off"
        lint/suspicious/noImplicitAnyLet: "off"
  eslint-8:
    enabled: true
    exclude_paths:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    disable_rules:
      - "ESLint8_security_detect-object-injection"
