---
exclude_paths:
  - "dist/**"
  - "node_modules/**"
  - "coverage/**"
  - ".mimicode/**"
  - ".agents/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
engines:
  biome:
    enabled: true
    config: biome.json
  eslint-8:
    enabled: true
    exclude_paths:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    disable_rules:
      - "ESLint8_security_detect-object-injection"
      - "ESLint8_security_detect-non-literal-fs-filename"
      - "ESLint8_security_detect-unsafe-regex"
      - "ESLint8_security_detect-buffer-noassert"
      - "ESLint8_security_detect-eval-with-expression"
      - "ESLint8_no-unsafe-finally"
      - "ESLint8_no-unsafe-return"
      - "ESLint8_no-unsafe-member-access"
      - "ESLint8_no-unsafe-call"
      - "ESLint8_no-unsafe-assignment"
      - "ESLint8_no-unsafe-template-expression"
      - "ESLint8_security_detect-non-literal-fs-filename"
      - "ESLint8_no-unsanitized-property-assignment"
      - "ESLint8_no-unsanitized-method-call"
      - "SecurityJs_prod.generic_object_injection_sink"
      - "SecurityJs_prod.variable_assigned_to_object_injection_sink"
      - "ESLint8_xss_no-mixed-html"  # False positive: encrypted export HTML is downloaded as a file, not executed in DOM
  opengrep:
    enabled: true
