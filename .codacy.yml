version: "1"
exclude_patterns:
  - "dist/"
  - "node_modules/"
  - "coverage/"
  - ".mimicode/"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
tools:
  biome:
    enabled: true
    config:
      rules:
        lint/correctness/useQwikValidLexicalScope: "off"
  eslint:
    enabled: true
    config:
      rules:
        security/detect-object-injection: "off"
