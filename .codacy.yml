---
exclude_paths:
  - "dist/**"
  - "node_modules/**"
  - "coverage/**"
  - ".mimocode/**"
  - ".agents/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
engines:
  biome:
    enabled: true
    config: biome.json
  eslint-9:
    enabled: true
    exclude_paths:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
  opengrep:
    enabled: true
