---
exclude_paths:
  - "dist/**"
  - "node_modules/**"
  - "coverage/**"
  - ".mimicode/**"
  - ".agents/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
engines:
  biome:
    enabled: true
    config: biome.json
  eslint-8:
    enabled: true
    exclude_paths:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    disable_rules:
      - "ESLint8_security_detect-object-injection"
      - "ESLint8_security_detect-non-literal-fs-filename"
