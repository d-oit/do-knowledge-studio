---
exclude_paths:
  - "dist/**"
  - "node_modules/**"
  - "coverage/**"
  - ".mimicode/**"
  - ".agents/**"
  - "**/__tests__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
engines:
  biome:
    enabled: true
    config: biome.json
  eslint-9:
    enabled: true
    exclude_paths:
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    disable_rules:
      - "ESLint9_security_detect-object-injection"
      - "ESLint9_security_detect-non-literal-fs-filename"
      - "ESLint9_security_detect-unsafe-regex"
      - "ESLint9_security_detect-buffer-noassert"
      - "ESLint9_security_detect-eval-with-expression"
      - "ESLint9_no-unsafe-finally"
      - "ESLint9_no-unsafe-return"
      - "ESLint9_no-unsafe-member-access"
      - "ESLint9_no-unsafe-call"
      - "ESLint9_no-unsafe-assignment"
      - "ESLint9_no-unsafe-template-expression"
      - "ESLint9_security_detect-non-literal-fs-filename"
      - "ESLint9_no-unsanitized-property-assignment"
      - "ESLint9_no-unsanitized-method-call"
      - "SecurityJs_prod.generic_object_injection_sink"
      - "SecurityJs_prod.variable_assigned_to_object_injection_sink"
      - "ESLint9_xss_no-mixed-html"  # False positive: encrypted export HTML is downloaded as a file, not executed in DOM
      - "ESLint9_@typescript-eslint_no-floating-promises"
  opengrep:
    enabled: true
