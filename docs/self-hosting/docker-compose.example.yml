# Example services for self-hosted peer-to-peer sync (#1052).
#
# Copy to the repository root as docker-compose.yml, set the TURN_* values, and
# follow docs/sync-self-hosting.md. Both services are optional: the studio works
# without them and "Sync via file" needs neither.
services:
  signaling:
    image: node:22-alpine
    command: >
      sh -c "npx --yes y-webrtc@10.3.0-signaling"
    ports:
      - "4444:4444"
    environment:
      # Terminate TLS in front of this port (Caddy, nginx, a cloud load
      # balancer) before exposing it: browsers require wss:// in production.
      HOST: 0.0.0.0
      PORT: "4444"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6-alpine
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro
    restart: unless-stopped
