# Gitleaks configuration for do-knowledge-studio
# Verifies: gitleaks detect --config .gitleaks.toml --source . --verbose

[extend]
useDefault = true

[allowlist]
  description = "Project-specific false positives"

  # Only allowlist test fixtures and verified-safe documentation examples.
  # Keep broad scanning on all other project files.
  paths = [
    '''tests/e2e/''',
    '''tests/fixtures/''',
    '''examples/''',
    # Historical test fixtures (files deleted from main but scanned via
    # full git history with fetch-depth: 0).
    '''src/lib/llm/__tests__/''',
    # SKILL.md documents env var names only; values are empty placeholders.
    '''do-web-doc-resolver/SKILL.md''',
  ]

  # Known safe patterns in test data and configuration examples
  regexes = [
    '''example[_-]?api[_-]?key''',
    '''test[_-]?api[_-]?key''',
    '''test[_-]?secret''',
    '''demo[_-]?token''',
    '''OPENROUTER_API_KEY''',
    '''KILO_API_KEY''',
    # security-patterns.md shows BAD examples for documentation purposes
    '''sk-abc123xyz''',
    '''BEGIN RSA PRIVATE KEY''',
  ]

  # SHA-256 of known-safe files (update if test fixtures change)
  # To generate: gitleaks detect --config .gitleaks.toml --source . --verbose --report-format json
  commits = []

  # Stop words that appear in comments/docs but are not real secrets
  stopwords = [
    '''your-api-key-here''',
    '''replace-with-your-key''',
    '''sk-xxxxxxxxxxxxxxxxxxxxxxxx''',
    '''ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx''',
  ]
