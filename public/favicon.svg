<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DO Knowledge Studio logo">
  <defs>
    <style>
      .logo-accent { fill: #c77d3a; }
      @media (prefers-color-scheme: dark) {
        .logo-accent { fill: #e5944a; }
      }
      .z-breathe {
        animation: breathe 2.5s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <!-- Outer rounded diamond — abstract crystallized node -->
  <path
    d="M15 2.5 L26.5 9 L26.5 21 L15 27.5 L3.5 21 L3.5 9 Z"
    fill="currentColor"
    stroke="none"
  />
  <!-- Inner facets — subtle depth -->
  <g class="z-breathe">
    <!-- Left facet -->
    <path
      d="M15 2.5 L8 7 L15 14 L22 7 Z"
      fill="currentColor"
      opacity="0.15"
    />
    <!-- Right facet -->
    <path
      d="M15 14 L22 7 L26.5 9 L26.5 21 L15 14 Z"
      fill="currentColor"
      opacity="0.08"
    />
    <!-- Bottom facet -->
    <path
      d="M15 14 L26.5 21 L15 27.5 L3.5 21 Z"
      fill="currentColor"
      opacity="0.12"
    />
    <!-- Accent node — the knowledge "spark" -->
    <circle cx="15" cy="11" r="3.2" class="logo-accent" />
    <!-- Connection lines radiating from node -->
    <line x1="15" y1="11" x2="8" y2="7" stroke="currentColor" stroke-width="1" opacity="0.4" />
    <line x1="15" y1="11" x2="22" y2="7" stroke="currentColor" stroke-width="1" opacity="0.4" />
    <line x1="15" y1="11" x2="15" y2="18" stroke="currentColor" stroke-width="1" opacity="0.3" />
  </g>
</svg>
