packages:
  - 'packages/*'

# pnpm 12 workspace-level package-manager and security policy.
engineStrict: true

peerDependencyRules:
  allowedVersions:
    eslint: "10"

overrides:
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  # Dependabot 110/113: typed-rest-client (stryker) pulls qs 6.15.1.
  "qs@<6.16.1": ^6.17.1
  # Dependabot 114: @eslint/config-array pulls minimatch 10.2.6.
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  brace-expansion@<1.1.18: 1.1.21
  brace-expansion@>=5: ^5.0.12
  picomatch: ^4.0.4
  browserslist: ^4.28.7
  js-yaml: ^4.3.2
  adm-zip: npm:adm-zip@0.6.1
  dompurify: ^3.4.18
  undici: ^7.30.2
  nanoid@3: 3.3.18
  postcss-selector-parser: ^7.1.6
  smol-toml: ^1.9.1
  katex: ^0.19.0
  re2js: ^2.9.1

audit:
  level: high
  # GHSA IDs are required by pnpm audit; CVE identifiers are not recognized.
  # This advisory was withdrawn as not practically exploitable (2026-10-23).
  ignore:
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  core-js: false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  unrs-resolver: false
